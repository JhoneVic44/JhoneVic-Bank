<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JhoneVic Bank · Account</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;touch-action:manipulation;background:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827}
.app{height:100%;width:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow:hidden}

/* ---------- TOP BAR ---------- */
.top-bar{padding:8px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;background:#fff;border-bottom:1px solid #e5e7eb}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;color:#111827}
.brand-mark{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;flex-shrink:0;background:#fff;color:#111827;border:2px solid #111827;box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px #111827}
.top-right{display:flex;align-items:center;gap:6px}
.live-clock{font-size:.65rem;font-weight:600;color:#6b7280;background:#f3f4f6;padding:3px 7px;border-radius:6px}
.save-btn{padding:5px 9px;background:#16a34a;color:white;border:none;border-radius:6px;font-size:.6rem;font-weight:700;cursor:pointer;white-space:nowrap}
.save-btn:active{transform:scale(.92);background:#15803d}
.save-btn.saved{background:#6b7280}
.reset-inline-btn{padding:5px 9px;background:#ef4444;color:white;border:none;border-radius:6px;font-size:.6rem;font-weight:700;cursor:pointer;white-space:nowrap}
.reset-inline-btn:active{transform:scale(.92);background:#dc2626}
.back-btn{background:none;border:none;color:#6b7280;font-size:1.1rem;padding:6px;cursor:pointer}
.back-btn:active{transform:scale(.85);color:#ef4444}

/* ---------- SAVE STATUS BANNER ---------- */
.save-banner{position:fixed;top:0;left:0;right:0;z-index:9999;padding:6px 12px;font-size:.7rem;font-weight:600;text-align:center;color:#fff;background:#ef4444;transform:translateY(-100%);transition:transform .3s ease;padding-top:calc(6px + env(safe-area-inset-top))}
.save-banner.show{transform:translateY(0)}

/* ---------- BALANCE SECTION ---------- */
.balance-section{padding:10px 14px 6px;flex-shrink:0}
.overall-card{background:#111827;border-radius:16px;padding:14px;color:white;box-shadow:0 8px 20px rgba(17,24,39,.15);text-align:center;margin-bottom:8px}
.greeting{font-size:.7rem;color:#9ca3af;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.overall-amount{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.1}
.split-balances{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-card{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03);border:1px solid #e5e7eb}
.mini-label{font-size:.55rem;color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:.04em;margin-bottom:3px}
.mini-amount{font-size:1rem;font-weight:700;color:#111827;overflow-wrap:anywhere}

/* ---------- FARE SETTINGS ---------- */
.fare-settings{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;align-items:end}
.fare-setting,.fare-budget-total{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:7px 9px;min-width:0}
.fare-setting label,.fare-budget-total span{display:block;font-size:.55rem;color:#6b7280;text-transform:uppercase;font-weight:600;letter-spacing:.03em;margin-bottom:3px}
.fare-setting input{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:6px;font:600 16px inherit;color:#111827;background:#f9fafb;text-align:center}
.fare-budget-total{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fare-budget-total span{margin:0}.fare-budget-total strong{font-size:.9rem;color:#111827}
.fare-update-btn{display:block;margin:6px auto 0;padding:6px 16px;background:#111827;color:white;border:none;border-radius:6px;font-size:.65rem;font-weight:700;cursor:pointer;letter-spacing:.03em}
.fare-update-btn:active{transform:scale(.95);background:#374151}

/* ---------- INPUT SECTION ---------- */
.input-section{padding:6px 14px;flex-shrink:0}
.input-box{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.02);border:1px solid #e5e7eb}
.toggle-row{display:flex;background:#f3f4f6;border-radius:8px;padding:3px;margin-bottom:8px}
.toggle-btn{flex:1;padding:7px;border:none;background:transparent;border-radius:6px;font-size:.7rem;font-weight:600;color:#6b7280;cursor:pointer;transition:all .2s}
.toggle-btn:active{transform:scale(.95)}
.toggle-btn.active{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 95px 55px;gap:6px;align-items:end}
.input-group{display:flex;flex-direction:column;gap:4px;min-width:0}
.input-label{font-size:.55rem;color:#9ca3af;text-align:center;text-transform:uppercase;font-weight:600}
.form-grid input{padding:10px 6px;background:#f3f4f6;border:1px solid transparent;border-radius:8px;font-size:16px;color:#111827;outline:none;transition:all .2s;font-family:inherit;width:100%;min-width:0;text-align:center;font-weight:600}
.form-grid input:focus{background:#fff;border-color:#111827;box-shadow:0 0 0 2px rgba(17,24,39,.1)}
.add-btn{background:#111827;color:white;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;height:38px;display:flex;align-items:center;justify-content:center}
.add-btn:active{transform:scale(.92);background:#374151}
.budget-update-box{background:#fff;border-radius:12px;padding:10px;margin-top:6px;border:1px solid #e5e7eb;display:flex;gap:6px}
.budget-update-box input{flex:1;padding:10px 6px;background:#f3f4f6;border:1px solid #111827;border-radius:8px;font-size:16px;text-align:center;outline:none;font-family:inherit;min-width:0;font-weight:700;color:#111827}
.update-btn{padding:0 16px;background:#1a73e8;color:white;border:none;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;height:38px}
.update-btn:active{transform:scale(.92);background:#1b66c9}

/* ---------- HISTORY ---------- */
.history-section{flex:1;display:flex;flex-direction:column;padding:6px 14px 10px;min-height:0;overflow:hidden}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-shrink:0;position:relative}
.history-title{font-size:.65rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding-top:2px}
.clear-btn{position:absolute;right:0;top:-4px;background:none;border:none;color:#ef4444;font-size:.65rem;font-weight:600;cursor:pointer;padding:3px}
.clear-btn:active{transform:scale(.85)}
.history-list{background:#fff;border-radius:12px;overflow-y:auto;flex:1;box-shadow:0 2px 8px rgba(0,0,0,.02);border:1px solid #e5e7eb;-webkit-overflow-scrolling:touch}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 12px;border-bottom:1px solid #f3f4f6}
.history-item:last-child{border-bottom:none}
.item-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.item-name{font-size:.8rem;font-weight:600;color:#111827;overflow-wrap:anywhere}
.item-type{font-size:.55rem;color:#6b7280;background:#f3f4f6;padding:1px 5px;border-radius:3px;display:inline-block;width:fit-content;margin-top:1px}
.item-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.item-amount{font-size:.8rem;font-weight:700;white-space:nowrap}
.expense-amount{color:#ef4444}
.income-amount{color:#16a34a}
.del-btn{background:none;border:none;color:#d1d5db;cursor:pointer;font-size:.85rem;padding:5px}
.del-btn:active{transform:scale(.8);color:#ef4444}
.empty-state{text-align:center;color:#9ca3af;font-size:.75rem;padding:20px}
@media(max-width:360px){.form-grid{grid-template-columns:minmax(0,1fr) 80px 48px;gap:4px}.update-btn{padding:0 10px}.overall-amount{font-size:1.6rem}.history-title{font-size:.6rem}.clear-btn{font-size:.6rem}.fare-setting,.fare-budget-total{padding:6px 7px}.reset-inline-btn,.save-btn{padding:4px 7px;font-size:.55rem}.fare-update-btn{padding:5px 12px;font-size:.6rem}.mini-amount{font-size:.9rem}}
</style>
</head>
<body>
<div class="save-banner" id="saveBanner">⚠️ Storage unavailable — changes won't be saved</div>
<div class="app">
  <div class="top-bar">
    <div class="brand"><div class="brand-mark">J</div>JhoneVic Bank</div>
    <div class="top-right">
      <div class="live-clock" id="liveClock">--:--</div>
      <button class="save-btn" id="saveNowBtn" type="button">Save</button>
      <button class="reset-inline-btn" id="resetBtn" type="button">Reset All</button>
      <button class="back-btn" id="backBtn" aria-label="Go back">✕</button>
    </div>
  </div>

  <div class="balance-section">
    <div class="overall-card">
      <div class="greeting">Total Balance</div>
      <div class="overall-amount" id="overallBalanceDisplay">₱0.00</div>
    </div>
    <div class="split-balances">
      <div class="mini-card"><div class="mini-label">Available for Expenses</div><div class="mini-amount" id="expensesDisplay">₱0.00</div></div>
      <div class="mini-card"><div class="mini-label">Fare Budget Remaining</div><div class="mini-amount" id="fareDisplay">₱0.00</div></div>
    </div>
    <div class="fare-settings">
      <div class="fare-setting">
        <label for="fareRateInput">Fare per day (₱)</label>
        <input id="fareRateInput" type="text" inputmode="decimal" autocomplete="off" placeholder="₱0.00">
      </div>
      <div class="fare-setting">
        <label for="fareDaysInput">Number of days</label>
        <input id="fareDaysInput" type="number" min="0" step="1" value="11">
      </div>
      <div class="fare-budget-total"><span>Total fare budget</span><strong id="fareBudgetTotal">₱748.00</strong></div>
    </div>
    <button class="fare-update-btn" id="updateFareBtn" type="button">Update Fare</button>
  </div>

  <div class="input-section">
    <div class="input-box">
      <div class="toggle-row">
        <button class="toggle-btn active" id="toggleExpense" type="button">Expenses</button>
        <button class="toggle-btn" id="toggleFare" type="button">Daily Fare</button>
      </div>
      <div class="form-grid">
        <div class="input-group"><div class="input-label" id="nameLabel">Product</div><input type="text" id="itemName" placeholder="e.g. Coffee" autocomplete="off"></div>
        <div class="input-group"><div class="input-label">Amount</div><input type="text" id="itemAmount" placeholder="₱0.00" inputmode="decimal"></div>
        <button class="add-btn" id="addBtn" type="button">Add</button>
      </div>
    </div>
    <div class="budget-update-box">
      <input type="text" id="updateTotalInput" placeholder="₱0.00" inputmode="decimal" aria-label="Amount to add to total balance">
      <button class="update-btn" id="updateBudgetBtn" type="button">Update</button>
    </div>
  </div>

  <div class="history-section">
    <div class="history-header"><span class="history-title">Recent Transactions</span><button class="clear-btn" id="clearBtn" type="button">Clear History</button></div>
    <div class="history-list" id="historyList"><div class="empty-state">No transactions yet.</div></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'jhonevicBank_final_v6';
  const BACKUP_KEY  = 'jhonevicBank_final_v6_backup';
  let totalBalance = 0;
  let expenses = [];
  let archivedExpenseSpent = 0;
  let archivedFareSpent = 0;
  let fareRate = 0;
  let fareDays = 11;
  let currentType = 'expense';
  let storageAvailable = true;
  const CURRENCY = '₱';
  const $ = id => document.getElementById(id);

  const overallBalanceDisplay = $('overallBalanceDisplay');
  const expensesDisplay = $('expensesDisplay');
  const fareDisplay = $('fareDisplay');
  const liveClock = $('liveClock');
  const toggleExpense = $('toggleExpense');
  const toggleFare = $('toggleFare');
  const itemName = $('itemName');
  const itemAmount = $('itemAmount');
  const historyList = $('historyList');
  const clearBtn = $('clearBtn');
  const updateTotalInput = $('updateTotalInput');
  const updateBudgetBtn = $('updateBudgetBtn');
  const nameLabel = $('nameLabel');
  const fareRateInput = $('fareRateInput');
  const fareDaysInput = $('fareDaysInput');
  const fareBudgetTotalDisplay = $('fareBudgetTotal');
  const resetBtn = $('resetBtn');
  const updateFareBtn = $('updateFareBtn');
  const saveBanner = $('saveBanner');
  const saveNowBtn = $('saveNowBtn');

  function testStorage() {
    try {
      const k = '__test__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }
  storageAvailable = testStorage();
  if (!storageAvailable) {
    saveBanner.classList.add('show');
    setTimeout(() => saveBanner.classList.remove('show'), 5000);
  }

  function formatMoney(amount) {
    return CURRENCY + amount.toLocaleString('en-PH', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function parseMoney(value) {
    const cleaned = String(value).replace(/[^0-9.]/g, '');
    if (!cleaned) return NaN;
    const dotCount = (cleaned.match(/\./g) || []).length;
    if (dotCount > 1) return NaN;
    const amount = Number(cleaned);
    return Number.isFinite(amount) ? amount : NaN;
  }

  function roundMoney(amount) {
    return Math.round((amount + Number.EPSILON) * 100) / 100;
  }

  function spentByType(type) {
    const archived = type === 'fare' ? archivedFareSpent : archivedExpenseSpent;
    return roundMoney(archived + expenses.filter(e => e.type === type).reduce((sum, e) => sum + e.amount, 0));
  }

  function fareBudget() { return roundMoney(fareRate * fareDays); }
  function fareRemaining() { return Math.max(0, roundMoney(fareBudget() - spentByType('fare'))); }
  function expenseAvailable() { return Math.max(0, roundMoney(totalBalance - fareRemaining())); }

  function formatDate(iso) {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return 'Unknown date';
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
      date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function updateClock() {
    liveClock.textContent = new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function snapshot() {
    return {
      v: 6,
      totalBalance,
      expenses,
      archivedExpenseSpent,
      archivedFareSpent,
      fareRate,
      fareDays,
      savedAt: Date.now()
    };
  }

  function save() {
    if (!storageAvailable) return false;
    const data = snapshot();
    let ok = false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      ok = true;
    } catch (e) {
      try { localStorage.removeItem(BACKUP_KEY); } catch (_) {}
    }
    try {
      localStorage.setItem(BACKUP_KEY, JSON.stringify(data));
      ok = true;
    } catch (e) { /* ignore */ }

    if (!ok) {
      storageAvailable = false;
      saveBanner.classList.add('show');
    }
    return ok;
  }

  function readStored(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return null;
      return d;
    } catch (e) { return null; }
  }

  function applyData(data) {
    if (!data) return false;
    let touched = false;
    if (Number.isFinite(Number(data.totalBalance))) { totalBalance = Number(data.totalBalance); touched = true; }
    if (Number.isFinite(Number(data.archivedExpenseSpent))) { archivedExpenseSpent = Math.max(0, Number(data.archivedExpenseSpent)); touched = true; }
    if (Number.isFinite(Number(data.archivedFareSpent))) { archivedFareSpent = Math.max(0, Number(data.archivedFareSpent)); touched = true; }
    if (Number.isFinite(Number(data.fareRate)) && Number(data.fareRate) >= 0) { fareRate = Number(data.fareRate); touched = true; }
    if (Number.isFinite(Number(data.fareDays)) && Number(data.fareDays) >= 0) { fareDays = Math.floor(Number(data.fareDays)); touched = true; }

    if (Array.isArray(data.expenses)) {
      expenses = data.expenses.filter(e =>
        e && Number.isFinite(Number(e.amount)) && Number(e.amount) >= 0 &&
        ['expense', 'fare', 'income'].includes(e.type)
      ).map(e => ({
        id: e.id ?? (Date.now() + Math.random()),
        name: String(e.name || 'Transaction'),
        amount: Number(e.amount),
        type: e.type,
        date: e.date || new Date().toISOString()
      }));
      touched = true;
    }
    return touched;
  }

  function load() {
    let data = readStored(STORAGE_KEY);
    if (!data) data = readStored(BACKUP_KEY);
    if (!data) data = readStored('jhonevicBank_final_v5');
    if (data && applyData(data)) {
      save();
      return true;
    }
    return false;
  }

  function applyLivePesoFormatting(input) {
    input.addEventListener('input', function () {
      let raw = this.value.replace(/[^0-9.]/g, '');
      const firstDot = raw.indexOf('.');
      if (firstDot !== -1) {
        raw = raw.slice(0, firstDot + 1) + raw.slice(firstDot + 1).replace(/\./g, '');
      }
      const parts = raw.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      if (parts.length === 2) parts[1] = parts[1].slice(0, 2);
      if (raw === '' || raw === '.') {
        this.value = raw === '.' ? CURRENCY + '0.' : '';
      } else {
        this.value = CURRENCY + parts.join('.');
      }
    });
  }

  applyLivePesoFormatting(itemAmount);
  applyLivePesoFormatting(updateTotalInput);
  applyLivePesoFormatting(fareRateInput);

  function render() {
    overallBalanceDisplay.textContent = formatMoney(totalBalance);
    expensesDisplay.textContent = formatMoney(expenseAvailable());
    fareDisplay.textContent = formatMoney(fareRemaining());
    fareBudgetTotalDisplay.textContent = formatMoney(fareBudget());

    if (document.activeElement !== fareRateInput) {
      fareRateInput.value = fareRate > 0 ? formatMoney(fareRate) : '';
    }

    historyList.replaceChildren();

    if (expenses.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No transactions yet.';
      historyList.appendChild(empty);
      return;
    }

    [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(transaction => {
      const row = document.createElement('div');
      row.className = 'history-item';

      const left = document.createElement('div');
      left.className = 'item-left';

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = transaction.name;

      const type = document.createElement('div');
      type.className = 'item-type';
      type.textContent = (transaction.type === 'income' ? 'Balance Added' :
        transaction.type === 'fare' ? 'Daily Fare' : 'Expense') + ' · ' + formatDate(transaction.date);
      left.append(name, type);

      const right = document.createElement('div');
      right.className = 'item-right';

      const amount = document.createElement('div');
      amount.className = 'item-amount ' + (transaction.type === 'income' ? 'income-amount' : 'expense-amount');
      amount.textContent = (transaction.type === 'income' ? '+' : '-') + formatMoney(transaction.amount);

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Delete ' + transaction.name);
      del.addEventListener('click', function () {
        const promptText = transaction.type === 'income'
          ? 'Delete this balance addition? The amount will be deducted from your balance.'
          : 'Delete this transaction? The amount will be restored to your balance and budget.';
        if (!confirm(promptText)) return;

        totalBalance = roundMoney(totalBalance + (transaction.type === 'income' ? -transaction.amount : transaction.amount));
        expenses = expenses.filter(e => e.id !== transaction.id);
        save();
        render();
      });

      right.append(amount, del);
      row.append(left, right);
      historyList.appendChild(row);
    });
  }

  function setType(type) {
    currentType = type;
    toggleExpense.classList.toggle('active', type === 'expense');
    toggleFare.classList.toggle('active', type === 'fare');
    nameLabel.textContent = type === 'fare' ? 'Fare Type' : 'Product';
    itemName.placeholder = type === 'fare' ? 'e.g. Jeep' : 'e.g. Coffee';
  }

  function addTransaction() {
    const name = itemName.value.trim();
    const amount = parseMoney(itemAmount.value);

    if (!name) {
      alert('Please enter a product or fare description.');
      itemName.focus();
      return;
    }
    if (!Number.isFinite(amount) || amount <= 0) {
      alert('Please enter a valid amount greater than ₱0.00.');
      itemAmount.focus();
      return;
    }
    if (currentType === 'fare' && amount > fareRemaining()) {
      alert('This amount is more than your remaining fare budget (' + formatMoney(fareRemaining()) + ').');
      itemAmount.focus();
      return;
    }
    if (currentType === 'expense' && amount > expenseAvailable()) {
      alert('This amount is more than your available expense budget (' + formatMoney(expenseAvailable()) + ').');
      itemAmount.focus();
      return;
    }
    if (amount > totalBalance) {
      alert('You do not have enough money in your total balance.');
      itemAmount.focus();
      return;
    }

    totalBalance = roundMoney(totalBalance - amount);
    expenses.push({
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random(),
      name,
      amount,
      type: currentType,
      date: new Date().toISOString()
    });

    itemName.value = '';
    itemAmount.value = '';
    save();
    render();
    itemName.blur();
    itemAmount.blur();
  }

  $('addBtn').addEventListener('click', addTransaction);
  itemName.addEventListener('keydown', e => { if (e.key === 'Enter') itemAmount.focus(); });
  itemAmount.addEventListener('keydown', e => { if (e.key === 'Enter') addTransaction(); });

  function updateBalance() {
    const amount = parseMoney(updateTotalInput.value);

    if (!Number.isFinite(amount) || amount <= 0) {
      alert('Please enter a valid amount greater than ₱0.00.');
      updateTotalInput.focus();
      return;
    }

    totalBalance = roundMoney(totalBalance + amount);
    expenses.push({
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random(),
      name: 'Balance Update',
      amount,
      type: 'income',
      date: new Date().toISOString()
    });

    save();
    render();
    updateTotalInput.value = '';
    updateTotalInput.blur();

    updateBudgetBtn.textContent = 'Added! ✓';
    updateBudgetBtn.style.background = '#238636';
    setTimeout(() => {
      updateBudgetBtn.textContent = 'Update';
      updateBudgetBtn.style.background = '#1a73e8';
    }, 1500);
  }

  updateBudgetBtn.addEventListener('click', updateBalance);
  updateTotalInput.addEventListener('keydown', e => { if (e.key === 'Enter') updateBalance(); });

  function clearAll() {
    if (!confirm('Clear the visible transaction history? Your balance and budget calculations will be kept.')) return;
    archivedExpenseSpent = roundMoney(archivedExpenseSpent + expenses.filter(e => e.type === 'expense').reduce((sum, e) => sum + e.amount, 0));
    archivedFareSpent = roundMoney(archivedFareSpent + expenses.filter(e => e.type === 'fare').reduce((sum, e) => sum + e.amount, 0));
    expenses = [];
    save();
    render();
  }

  function resetEverything() {
    if (!confirm('Reset everything? This will erase your total balance, budgets, settings, and transaction history. This cannot be undone.')) return;
    totalBalance = 0;
    expenses = [];
    archivedExpenseSpent = 0;
    archivedFareSpent = 0;
    fareRate = 0;
    fareDays = 0;
    fareRateInput.value = '';
    fareDaysInput.value = '0';
    itemName.value = '';
    itemAmount.value = '';
    updateTotalInput.value = '';
    save();
    render();
    setType('expense');
  }

  clearBtn.addEventListener('click', clearAll);
  resetBtn.addEventListener('click', resetEverything);

  function updateFareSettings() {
    const rate = parseMoney(fareRateInput.value);
    const days = Number(fareDaysInput.value);

    const safeRate = Number.isFinite(rate) && rate >= 0 ? rate : 0;

    if (!Number.isFinite(days) || days < 0 || !Number.isInteger(days)) {
      alert('Please enter a whole number of days (zero or more).');
      fareDaysInput.value = String(fareDays);
      return;
    }

    fareRate = roundMoney(safeRate);
    fareDays = days;

    fareRateInput.value = fareRate > 0 ? formatMoney(fareRate) : '';

    save();
    render();
  }

  fareRateInput.addEventListener('change', updateFareSettings);
  fareDaysInput.addEventListener('change', updateFareSettings);
  updateFareBtn.addEventListener('click', updateFareSettings);

  /* ---------- MANUAL SAVE BUTTON ---------- */
  saveNowBtn.addEventListener('click', function () {
    const ok = save();
    if (ok) {
      saveNowBtn.textContent = 'Saved ✓';
      saveNowBtn.classList.add('saved');
      setTimeout(() => {
        saveNowBtn.textContent = 'Save';
        saveNowBtn.classList.remove('saved');
      }, 1500);
    } else {
      saveNowBtn.textContent = 'Failed ✗';
      setTimeout(() => { saveNowBtn.textContent = 'Save'; }, 1500);
      saveBanner.classList.add('show');
      setTimeout(() => saveBanner.classList.remove('show'), 4000);
    }
  });

  $('backBtn').addEventListener('click', () => {
    save();
    window.location.href = 'index.html';
  });

  toggleExpense.addEventListener('click', () => setType('expense'));
  toggleFare.addEventListener('click', () => setType('fare'));

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') save();
  });
  window.addEventListener('pagehide', save);
  window.addEventListener('beforeunload', save);

  load();
  render();
  updateClock();
  setInterval(updateClock, 1000);

  window.__jvBankDebug = { save, load, snapshot };
})();
</script>
</body>
</html>
